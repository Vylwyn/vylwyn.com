name: CI

# Run on every push to main and on every pull request targeting main.
# Pull requests matter later when you start branching per feature.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push twice quickly, cancel the older run instead of burning
# minutes on a result nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }} · MySQL)
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel the 8.4 run just because 8.3 failed — we want both results.
      fail-fast: false
      matrix:
        # 8.4 only. Laravel 13 declares a floor of 8.3, but the resolved
        # dependency set (Symfony 8.1, PHPUnit 13, Pest 5) requires 8.4.1+.
        # Hostinger production runs 8.4, so this matches deployment exactly.
        # config.platform.php in composer.json pins resolution to the same version.
        php: ['8.4']

    # A real MySQL server, spun up as a container alongside the job.
    # This is the parity check your local SQLite tests can't give you.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portfolio_testing
        ports:
          - 3306:3306
        # Without this, the job races the database and fails intermittently.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, zip, gd, xmlwriter
          coverage: none

      # Composer downloads are the slowest part of the job.
      # Caching them by lock-file hash turns ~40s into ~3s on repeat runs.
      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # public/build is gitignored, so the Vite manifest doesn't exist in a fresh
      # checkout. Any test that renders a Blade view using @vite would fail
      # without this step.
      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: portfolio_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      # Override the SQLite settings baked into phpunit.xml so the suite
      # runs against the real MySQL service above.
      - name: Run Pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: portfolio_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # --test reports violations and exits non-zero instead of rewriting files.
      # Locally you run plain `vendor/bin/pint` to actually fix them.
      - name: Check formatting
        run: vendor/bin/pint --test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    # Only after both checks pass, only on main, and never for pull requests.
    # A broken build must not be able to reach the live site.
    needs: [tests, code-style]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Two deploys overlapping would rsync half-states over each other.
    concurrency:
      group: production
      cancel-in-progress: false

    environment:
      name: production
      url: https://vylwyn.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, zip, gd, xmlwriter
          coverage: none

      # --no-dev strips Pest, Pint, Boost and friends. Production has no reason
      # to carry test tooling, and it meaningfully shrinks what gets uploaded.
      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # Hostinger has no Node, so the compiled assets are produced here and
      # shipped. This is why public/build can stay gitignored.
      - name: Build assets
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key rather than disabling checking — accepting any key
          # would leave the deploy open to a man-in-the-middle.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Step 1 — the application, into a directory it owns exclusively.
      #
      # --delete makes the target byte-identical to the build, which is only
      # safe because DEPLOY_PATH contains nothing but this app. It must never
      # point at public_html: that directory also holds the subdomain folders
      # (roomsphere, fairshare, coolpextest…) and --delete would erase them.
      - name: Upload application
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='storage/app' \
            --exclude='storage/framework' \
            --exclude='storage/logs' \
            --exclude='public/storage' \
            --exclude='tests' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Publish web root and run post-deploy commands
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e

            APP_PATH="${{ secrets.DEPLOY_PATH }}"
            WEB_ROOT="${{ secrets.PUBLIC_HTML_PATH }}"

            cd "$APP_PATH"

            # Runtime directories are excluded from rsync so their contents
            # survive deploys — which means on a fresh server they don't exist
            # at all, and Laravel fails with "Please provide a valid cache path".
            # Creating them here makes the deploy self-healing.
            mkdir -p storage/framework/cache/data \
                     storage/framework/sessions \
                     storage/framework/views \
                     storage/framework/testing \
                     storage/app/public \
                     storage/app/private \
                     storage/logs \
                     bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Refuse requests while migrations run, then lift it.
            php artisan down --retry=15 || true

            php artisan migrate --force

            # Creates laravel/public/storage. We don't copy that symlink across;
            # public_html gets its own, pointing at the same target.
            php artisan storage:link || true

            # Cache config, routes, views and events. Biggest production
            # speed-up available, and the reason env() must never be called
            # outside config files — once cached it returns null.
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Republish Filament's assets to match the installed version.
            php artisan filament:upgrade

            # Step 2 — publish the web root.
            #
            # Deliberately NO --delete here. public_html also contains the
            # subdomain folders, which must survive untouched.
            rsync -a \
              --exclude='storage' \
              --exclude='index.php' \
              "$APP_PATH/public/" "$WEB_ROOT/"

            # Entry point rewritten to bootstrap from ../laravel, so the
            # application itself stays above the document root.
            cp "$APP_PATH/deploy/public_html-index.php" "$WEB_ROOT/index.php"

            # Public disk symlink for uploaded cover images.
            ln -sfn "$APP_PATH/storage/app/public" "$WEB_ROOT/storage"

            php artisan up
          ENDSSH

      - name: Verify the site responds
        run: |
          # A deploy that "succeeds" while serving a 500 is worse than a
          # failed one, because nothing tells you.
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://vylwyn.com)
          echo "vylwyn.com returned $code"
          test "$code" = "200"
